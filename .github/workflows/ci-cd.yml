name: CI and production images

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:pwa
      - run: npm run build

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx --no-install prisma generate
      - run: npx --no-install prisma validate
      - run: npm run build
      - run: npm test -- --runInBand
      - name: Verify additive migration and business transactions
        run: |
          npx --no-install prisma db push --skip-generate
          node test/setup-ci.cjs
          node test/report-door.cjs
          node test/refunds.cjs
          node test/data-transfer.cjs
          node test/finance-control.cjs
          node test/academic-transition.cjs
          node test/registration-atomicity.cjs
          node test/parent-identity.cjs
          TEST_DATABASE_URL="$DATABASE_URL" node test/additive-financial-patch.cjs
      - name: Verify deployment rollback scenarios
        working-directory: .
        run: python3 -m unittest discover -s deploy/tests -v

  publish_images:
    name: Publish production images to Docker Hub
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo '::error::Missing DOCKERHUB_USERNAME secret'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo '::error::Missing DOCKERHUB_TOKEN secret'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            mormbathie/oumouna-khadija-backend:${{ github.sha }}
            mormbathie/oumouna-khadija-backend:latest
          build-args: APP_REVISION=${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            mormbathie/oumouna-khadija-frontend:${{ github.sha }}
            mormbathie/oumouna-khadija-frontend:latest
          build-args: |
            APP_REVISION=${{ github.sha }}
            VITE_API_URL=/api
            VITE_KEYCLOAK_URL=https://auth.oumounakhadidja-academie.com
            VITE_KEYCLOAK_REALM=oumouna-khadija
            VITE_KEYCLOAK_CLIENT_ID=oumouna-khadija-app

  deploy_vps:
    name: Deploy verified images to VPS
    needs: [publish_images]
    if: vars.VPS_AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Deploy the current main release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/oumouna-khadija-deploy-key"
          hosts_file="$RUNNER_TEMP/oumouna-khadija-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts_file"
          ssh -T -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" root@57.129.187.36 "$GITHUB_SHA"
