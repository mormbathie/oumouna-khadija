# Production images are built in CI and selected by deploy/production.env.
# The protected .env and realm are generated on the VPS by deploy/bootstrap.py.
volumes:
  caddy_data:
  caddy_config:

services:
  keycloak:
    group_add:
      - "1000"
    environment:
      KC_HOSTNAME: !reset null
      KC_HOSTNAME_PORT: !reset null
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in the server .env}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./deploy/realm.production.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - ./frontend/public/oumouna-khadija-logo.png:/opt/keycloak/themes/oumouna-khadija/login/resources/img/logo.png:ro

  backend:
    image: mormbathie/oumouna-khadija-backend:${APP_VERSION:-latest}
    build: !reset null

    volumes:
      - ./deploy/smtp.private.json:/run/secrets/school-smtp.json:ro
    environment:
      SCHOOL_SMTP_CONFIG_FILE: /run/secrets/school-smtp.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://assakina-telemetry:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.25"

  frontend:
    image: mormbathie/oumouna-khadija-frontend:${APP_VERSION:-latest}
    build: !reset null

  caddy:
    image: caddy:2-alpine
    container_name: oumouna_khadija_caddy
    restart: unless-stopped
    networks:
      - oumou_net
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in the server .env}
      AUTH_HOST: ${AUTH_HOST:?Set AUTH_HOST in the server .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
