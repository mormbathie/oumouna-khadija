name: oumouna-khadija

# ─────────────────────────────────────────────────────────────
#  RÉSEAU INTERNE
# ─────────────────────────────────────────────────────────────
networks:
  oumou_net:
    driver: bridge

# ─────────────────────────────────────────────────────────────
#  VOLUMES PERSISTANTS
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    # Volume propre à cette application; aucun partage avec le projet source.
    name: ${POSTGRES_VOLUME_NAME:-oumounakhadija2027_postgres_data}
  keycloak_postgres_data:
  school_documents:

# ─────────────────────────────────────────────────────────────
#  SERVICES
# ─────────────────────────────────────────────────────────────
services:

  # ── 1. BASE DE DONNÉES PostgreSQL ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oumouna_khadija_postgres
    restart: unless-stopped
    networks:
      - oumou_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-oumouna_khadija_db}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oumouna_khadija_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 2. KEYCLOAK DATABASE ───────────────────────────────────
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: oumouna_khadija_keycloak_postgres
    restart: unless-stopped
    networks:
      - oumou_net
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_only_change_before_production}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 3. KEYCLOAK (auth) ─────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: oumouna_khadija_keycloak
    restart: unless-stopped
    networks:
      - oumou_net
    command: start --http-enabled=true --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_only_change_before_production}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/"
      # Keep this hostname aligned with KEYCLOAK_PUBLIC_URL used by the backend.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KEYCLOAK_HOSTNAME_PORT:-8081}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && IFS= read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-postgres:
        condition: service_healthy

  # ── 4. BACKEND NestJS ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: oumouna-khadija-backend:latest
    container_name: oumouna_khadija_backend
    restart: unless-stopped
    networks:
      - oumou_net
    volumes:
      - school_documents:/app/uploads
    environment:
      DOCUMENTS_STORAGE_PATH: /app/uploads
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://localhost}

      # Base de données — utilise le nom du service Docker (postgres:5432)
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-oumouna_khadija_db}?schema=public}

      # URL publique Keycloak; it must match KC_HOSTNAME and the token issuer.
      KEYCLOAK_AUTH_SERVER_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}"
      KEYCLOAK_REALM: "oumouna-khadija"
      KEYCLOAK_CLIENT_ID: "oumouna-khadija-app"
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # URL interne Keycloak (réseau Docker → keycloak:8080)
      # Utilisée par le backend pour fetcher les clés JWKS
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"

      # Informations école
      SCHOOL_NAME: "Institut Oumouna Khadija"
      SCHOOL_PHONE: "+221 77 433 05 08"
      SCHOOL_EMAIL: ${SCHOOL_EMAIL:-oumounakhadidja21@gmail.com}
      SCHOOL_ADDRESS: "Parcelles Assainies, Unité 25, Dakar"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3002}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── 5. FRONTEND React (Nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Keycloak accessible depuis le browser → toujours localhost:8080
        VITE_KEYCLOAK_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}"
        VITE_KEYCLOAK_REALM: "oumouna-khadija"
        VITE_KEYCLOAK_CLIENT_ID: "oumouna-khadija-app"
    image: oumouna-khadija-frontend:latest
    container_name: oumouna_khadija_frontend
    restart: unless-stopped
    networks:
      - oumou_net
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
