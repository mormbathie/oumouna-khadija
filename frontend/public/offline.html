<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b48724"><title>Institut Oumouna Khadija — Connexion nécessaire</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#172c25;font:16px/1.6 system-ui,sans-serif;padding:24px}main{width:100%;max-width:440px;background:white;border:1px solid #dbe5df;border-radius:20px;padding:32px;text-align:center}h1{font-size:24px}button{border:0;border-radius:10px;background:#b48724;color:white;font:inherit;padding:12px 22px;cursor:pointer}small{display:block;margin-top:24px;color:#64748b}</style></head><body><main><p>Institut Oumouna Khadija</p><h1 id="title">Connexion Internet nécessaire</h1><p id="message">L’application ne peut pas joindre le serveur. Reconnectez votre téléphone pour consulter les données, enregistrer un paiement ou effectuer un pointage.</p><button id="retry" onclick="location.reload()">Réessayer</button><small id="notice">Aucune opération n’est enregistrée hors connexion.</small></main><script>const language=localStorage.getItem('school_language');const texts={en:['Internet connection required','The application cannot reach the server. Reconnect your phone to view records, record payments or mark attendance.','Try again','No operations are saved offline.'],ar:['الاتصال بالإنترنت مطلوب','لا يمكن للتطبيق الاتصال بالخادم. أعد الاتصال لعرض البيانات أو تسجيل المدفوعات أو الحضور.','حاول مجدداً','لا يتم حفظ أي عملية دون اتصال.']};if(texts[language]){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';['title','message','retry','notice'].forEach((id,i)=>document.getElementById(id).textContent=texts[language][i]);}</script></body></html>
