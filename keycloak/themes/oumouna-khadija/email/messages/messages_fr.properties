passwordResetBody=Bonjour,\n\nUne demande de changement de mot de passe a été effectuée pour votre compte Oumouna Khadija. Ouvrez le lien ci-dessous pour créer un nouveau mot de passe.\n\n{0}\n\nCe lien sécurisé expirera dans {3}. Si vous n’êtes pas à l’origine de cette demande, ignorez ce message.
