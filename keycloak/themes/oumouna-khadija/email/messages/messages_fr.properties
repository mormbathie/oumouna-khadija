executeActionsSubject=Activez votre compte Oumouna Khadija
executeActionsBody=Bonjour,\n\nVotre compte sur la plateforme Oumouna Khadija a été créé. Pour vous connecter, veuillez activer votre compte en ouvrant le lien ci-dessous, puis créer votre mot de passe.\n\n{0}\n\nCe lien sécurisé expirera dans {4}.\n\nSi vous ne vous attendiez pas à recevoir cette invitation, vous pouvez ignorer ce message.\n\nInstitut Oumouna Khadija
executeActionsBodyHtml=<p>Bonjour,</p><p>Votre compte sur la plateforme <strong>Oumouna Khadija</strong> a été créé.</p><p>Pour vous connecter, veuillez activer votre compte en cliquant sur le bouton ci-dessous, puis créer votre mot de passe.</p><p><a href="{0}">Activer mon compte et créer mon mot de passe</a></p><p>Ce lien sécurisé expirera dans {4}.</p><p>Si vous ne vous attendiez pas à recevoir cette invitation, vous pouvez ignorer ce message.</p><p><strong>Institut Oumouna Khadija</strong></p>
