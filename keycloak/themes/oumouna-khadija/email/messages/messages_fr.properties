executeActionsBody=Bonjour,\n\nVotre compte chez Oumouna Khadija a été créé.\n\nPour finaliser la création et vous connecter, veuillez activer votre compte en cliquant sur le lien ci-dessous afin de confirmer votre compte et définir votre mot de passe :\n\n{0}\n\nCe lien sécurisé expirera dans {4}.\n\nSi vous n'êtes pas à l'origine de cette demande, vous pouvez ignorer cet e-mail.\n\nCordialement,\nInstitut Oumouna Khadija
executeActionsBodyHtml=<p>Bonjour,</p><p>Votre compte sur la plateforme <strong>Institut Oumouna Khadija</strong> a été créé.</p><p>Pour finaliser la création et vous connecter, veuillez activer votre compte en cliquant sur le bouton ci-dessous afin de confirmer votre compte et définir votre mot de passe :</p><p style="margin: 24px 0;"><a href="{0}" style="background-color: #c98522; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block;">Confirmer mon compte et créer mon mot de passe</a></p><p style="color: #666; font-size: 13px;">Si le bouton ne fonctionne pas, copiez et collez ce lien dans votre navigateur :<br><a href="{0}">{0}</a></p><p style="color: #888; font-size: 12px; margin-top: 20px;">Ce lien sécurisé expirera dans {4}. Si vous n'êtes pas à l'origine de cette demande, vous pouvez ignorer ce message.</p><p><strong>Institut Oumouna Khadija</strong></p>
